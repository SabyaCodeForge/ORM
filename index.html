<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NovaCRM — by Sabyx Labs</title>

<!-- PWA: manifest + icons + theme color -->
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#5B8CFF" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NovaCRM" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<style>
:root{
  --primary:#5B8CFF; --secondary:#7C6CFF;
  --bg:#EEF1F7; --surface:#F4F6FB; --text:#2A3040; --text-dim:#8A93A6;
  --shadow-a:rgba(163,177,198,0.55); --shadow-b:rgba(255,255,255,0.9);
  --border:rgba(200,206,220,0.5);
}
html.dark{
  --bg:#171A26; --surface:#1E2233; --text:#E7EAF2; --text-dim:#8993AC;
  --shadow-a:rgba(0,0,0,0.55); --shadow-b:rgba(50,56,78,0.35);
  --border:rgba(70,78,100,0.4);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{height:100%;margin:0;overflow-x:hidden;width:100%;max-width:100vw;}
body{
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-tap-highlight-color:transparent;
  transition: background .25s ease, color .25s ease;
}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(120,130,160,.35);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
input,select,textarea{font-family:inherit;color:var(--text);}

.neu-card{background:var(--surface);border-radius:1.5rem;box-shadow:8px 8px 18px var(--shadow-a), -8px -8px 18px var(--shadow-b);transition:box-shadow .25s ease, transform .25s ease;}
.neu-inset{background:var(--bg);border-radius:1rem;box-shadow:inset 5px 5px 10px var(--shadow-a), inset -5px -5px 10px var(--shadow-b);}
.neu-btn{background:var(--surface);border-radius:1rem;box-shadow:5px 5px 12px var(--shadow-a), -5px -5px 12px var(--shadow-b);transition:all .25s ease;}
.neu-btn:active{box-shadow:inset 4px 4px 8px var(--shadow-a), inset -4px -4px 8px var(--shadow-b); transform:scale(.97);}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:1rem;padding:12px 20px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:0 16px 30px -10px rgba(91,140,255,.4);transition:all .25s ease;}
.btn-primary:hover{filter:brightness(1.07);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:1rem;padding:10px 16px;font-size:14px;font-weight:500;color:var(--text-dim);transition:background .2s ease, color .2s ease, transform .15s ease;}
.btn-ghost:hover{color:var(--text);background:color-mix(in srgb, var(--text-dim) 10%, transparent);}
.btn-ghost:active{transform:scale(.97);}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;}
.b-slate{background:rgba(148,163,184,.2);color:#64748b;}
.b-blue{background:rgba(91,140,255,.15);color:#5B8CFF;}
.b-green{background:rgba(34,197,94,.15);color:#16a34a;}
.b-amber{background:rgba(245,158,11,.15);color:#d97706;}
.b-red{background:rgba(239,68,68,.15);color:#dc2626;}
.b-purple{background:rgba(124,108,255,.15);color:#7C6CFF;}
html.dark .b-green{color:#4ade80;} html.dark .b-amber{color:#fbbf24;} html.dark .b-red{color:#f87171;} html.dark .b-blue{color:#8fb2ff;} html.dark .b-purple{color:#a599ff;}

.input{width:100%;padding:12px 16px;border:none;outline:none;font-size:14px;background:var(--bg);border-radius:1rem;box-shadow:inset 5px 5px 10px var(--shadow-a), inset -5px -5px 10px var(--shadow-b);}
.input::placeholder{color:var(--text-dim);}
.label{font-size:12px;font-weight:500;color:var(--text-dim);margin-bottom:6px;display:block;}
.field{display:flex;flex-direction:column;gap:0;margin-bottom:14px;}

/* Custom file upload control — replaces the native OS "Choose File" button */
.file-upload{position:relative;}
.file-upload-zone{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:22px 16px;border-radius:1rem;background:var(--bg);border:1.5px dashed color-mix(in srgb, var(--text-dim) 40%, transparent);box-shadow:inset 3px 3px 8px var(--shadow-a), inset -3px -3px 8px var(--shadow-b);transition:border-color .2s ease, background .2s ease;}
.file-upload-zone.drag{border-color:var(--primary);background:color-mix(in srgb, var(--primary) 10%, var(--bg));}
.file-upload-zone input[type="file"]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;}
.file-upload-icon{width:36px;height:36px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));box-shadow:4px 4px 10px var(--shadow-a), -4px -4px 10px var(--shadow-b);}
.file-upload-title{font-size:13px;font-weight:600;margin:0;}
.file-upload-sub{font-size:11.5px;color:var(--text-dim);margin:2px 0 0;}
.file-upload-chip{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:1rem;background:var(--bg);box-shadow:inset 3px 3px 8px var(--shadow-a), inset -3px -3px 8px var(--shadow-b);}
.file-upload-chip.show{display:flex;}
.file-upload-chip .chip-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.file-upload-chip .chip-info{flex:1;min-width:0;}
.file-upload-chip .chip-name{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.file-upload-chip .chip-size{font-size:10.5px;color:var(--text-dim);}
.file-upload-chip .chip-remove{color:var(--text-dim);flex-shrink:0;padding:4px;border-radius:8px;transition:background .2s ease, color .2s ease;}
.file-upload-chip .chip-remove:hover{color:#EF4444;background:rgba(239,68,68,.12);}

.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

#app-shell{display:flex;min-height:100vh;min-height:100dvh;max-width:100vw;}
#sidebar{width:260px;flex-shrink:0;padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));padding-left:calc(20px + env(safe-area-inset-left));display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;height:100dvh;}
#sidebar .brand{display:flex;align-items:center;gap:12px;padding:0 4px;}
.brand-mark{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--bg);box-shadow:5px 5px 12px var(--shadow-a), -5px -5px 12px var(--shadow-b);padding:5px;}
.brand-mark img{width:100%;height:100%;object-fit:contain;}
#nav{display:flex;flex-direction:column;gap:6px;flex:1;}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:1rem;font-size:14px;font-weight:500;color:var(--text-dim);transition:all .25s ease;}
.nav-link.active{background:var(--bg);box-shadow:inset 5px 5px 10px var(--shadow-a), inset -5px -5px 10px var(--shadow-b);color:var(--primary);}
.nav-link:hover:not(.active){color:var(--text);}

#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;padding-top:calc(16px + env(safe-area-inset-top));padding-right:calc(28px + env(safe-area-inset-right));backdrop-filter:blur(8px);background:color-mix(in srgb, var(--bg) 82%, transparent);gap:12px;flex-wrap:wrap;}
#mobile-menu-btn{display:none;}

/* Notifications: bell + unread badge + dropdown panel of local due/overdue items
   (tasks, invoices, project deadlines) — fully offline, no server or messages involved */
#notif-wrap{position:relative;}
#notif-bell{padding:10px;position:relative;}
#notif-badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:#EF4444;color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;}
#notif-badge.show{display:flex;}
#notif-panel{display:none;position:fixed;z-index:40;width:340px;max-width:calc(100vw - 16px);max-height:70vh;overflow-y:auto;padding:8px;}
#notif-panel.open{display:block;}
.notif-item{padding:12px;border-radius:1rem;margin-bottom:6px;cursor:default;}
.notif-item.unread{background:var(--bg);box-shadow:inset 3px 3px 8px var(--shadow-a), inset -3px -3px 8px var(--shadow-b);}
.notif-item .notif-name{font-size:13px;font-weight:700;margin:0;}
.notif-item .notif-meta{font-size:11px;color:var(--text-dim);margin:2px 0 6px;}
.notif-item .notif-actions{display:flex;gap:6px;flex-wrap:wrap;}
.notif-item .notif-actions button{font-size:11px;padding:6px 10px;}
#main{flex:1;min-width:0;max-width:100%;display:flex;flex-direction:column;}
#page{flex:1;padding:0 28px 120px;padding-right:calc(28px + env(safe-area-inset-right));max-width:1600px;width:100%;margin:0 auto;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.page-title{font-size:clamp(20px, 5vw, 26px);font-weight:800;letter-spacing:-.02em;margin:0;}
.page-sub{font-size:14px;color:var(--text-dim);margin:6px 0 0;}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 0 24px;}

.grid{display:grid;gap:16px;}
.grid-stats{grid-template-columns:repeat(2,1fr);}
@media(min-width:700px){.grid-stats{grid-template-columns:repeat(3,1fr);}}
@media(min-width:1200px){.grid-stats{grid-template-columns:repeat(6,1fr);}}
.grid-cards{grid-template-columns:1fr;}
@media(min-width:640px){.grid-cards{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1100px){.grid-cards{grid-template-columns:repeat(3,1fr);}}
.grid-2{display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:1000px){.grid-2{grid-template-columns:2fr 1fr;}}
.grid-half{display:grid;gap:18px;grid-template-columns:1fr;}
@media(min-width:900px){.grid-half{grid-template-columns:1fr 1fr;}}

.stat-card{padding:20px;display:flex;align-items:center;gap:14px;}
.stat-icon{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;background:linear-gradient(135deg,var(--primary),var(--secondary));}
.stat-icon.secondary{background:linear-gradient(135deg,var(--secondary),var(--primary));}
.stat-label{font-size:11px;color:var(--text-dim);overflow-wrap:break-word;}
.stat-value{font-size:19px;font-weight:800;overflow-wrap:break-word;}

.empty{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
.empty p.title{font-weight:600;margin:0;}
.empty p.sub{font-size:13px;color:var(--text-dim);max-width:360px;margin:0;}

#fab-wrap{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:calc(24px + env(safe-area-inset-right));z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
#fab-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-bottom:2px;}
.fab-action{padding:10px 16px;font-size:13px;font-weight:600;white-space:nowrap;opacity:0;transform:translateY(8px) scale(.9);animation:fabIn .2s ease forwards;}
@keyframes fabIn{to{opacity:1;transform:translateY(0) scale(1);}}
#fab-main{width:58px;height:58px;border-radius:50%;font-size:26px;transition:transform .25s ease;}
#fab-main.open{transform:rotate(45deg);}

.modal-overlay{position:fixed;inset:0;background:rgba(10,12,20,.4);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;animation:fade .2s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box{border-radius:1.5rem;background:var(--surface);box-shadow:8px 8px 18px var(--shadow-a), -8px -8px 18px var(--shadow-b);padding:26px;width:100%;max-width:560px;margin:32px 0;animation:modalIn .25s ease;}
.modal-box.wide{max-width:820px;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h2{font-size:18px;font-weight:700;margin:0;}
.modal-body{max-height:65vh;overflow-y:auto;padding-right:4px;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;padding:12px 22px;border-radius:1rem;font-size:13px;font-weight:600;animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.hosting-banner{display:flex;align-items:flex-start;gap:12px;padding:14px 20px;margin:16px 28px 0;border-radius:1rem;background:rgba(245,158,11,.12);color:#b45309;font-size:12.5px;line-height:1.6;}
html.dark .hosting-banner{color:#fbbf24;}
.hosting-banner .hb-close{flex-shrink:0;margin-left:auto;color:inherit;opacity:.7;padding:2px;}
.hosting-banner .hb-close:hover{opacity:1;}
@media(max-width:1023px){.hosting-banner{margin:14px 16px 0;}}

table.data-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.data-table th{text-align:left;font-size:11px;color:var(--text-dim);font-weight:600;padding:12px 18px;border-bottom:1px solid var(--border);}
table.data-table td{padding:13px 18px;border-bottom:1px solid var(--border);}
table.data-table tr:last-child td{border-bottom:none;}
table.data-table tr.row-click{cursor:pointer;}
table.data-table tr.row-click:hover{background:color-mix(in srgb, var(--bg) 60%, transparent);}

.progress-bar{width:100%;height:8px;border-radius:99px;background:color-mix(in srgb, var(--text-dim) 25%, transparent);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--secondary));}

.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;}
.chip{padding:9px 16px;border-radius:1rem;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--text-dim);}
.chip.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--secondary));}

.cal-cell{min-height:84px;border-radius:1rem;padding:8px;cursor:pointer;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.cal-evt{font-size:10px;padding:2px 6px;border-radius:6px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Invoice item row — responsive so fields stay a usable width on phones
   instead of being crushed into 6 equal columns on a narrow screen. */
.item-row{padding:16px;margin-bottom:12px;}
.item-fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;}
.if-cell{min-width:0;}
.if-service{grid-column:span 2;}
.if-label{font-size:11px;color:var(--text-dim);display:block;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.input-compact{padding:10px;font-size:13px;min-width:0;}
.item-remove-btn{color:var(--text-dim);padding:9px;border-radius:10px;flex-shrink:0;transition:background .2s ease,color .2s ease;}
.item-remove-btn:hover{color:#EF4444;background:rgba(239,68,68,.12);}
@media(max-width:900px){
  .item-fields{grid-template-columns:repeat(2,minmax(0,1fr));}
  .if-service{grid-column:1/-1;}
}
@media(max-width:480px){
  .item-fields{gap:8px;}
  .input-compact{font-size:13px;padding:9px 8px;}
}

@media(max-width:1023px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:45;transform:translateX(-100%);transition:transform .25s ease;box-shadow:20px 0 40px rgba(0,0,0,.2);background:var(--bg);}
  #sidebar.open{transform:translateX(0);}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:44;}
  #sidebar-overlay.show{display:block;}
  #mobile-menu-btn{display:inline-flex;}
  #page{padding:0 16px 120px;padding-right:calc(16px + env(safe-area-inset-right));}
  #topbar{padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));padding-right:calc(16px + env(safe-area-inset-right));}
}
@media(max-width:479px){
  .grid-stats{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:14px;gap:10px;}
  .stat-icon{width:38px;height:38px;border-radius:12px;}
  .neu-card{border-radius:1.1rem;}
  #page{padding:0 12px 120px;padding-right:calc(12px + env(safe-area-inset-right));}
  #topbar{padding:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-right:calc(12px + env(safe-area-inset-right));}
  .modal-box{padding:18px;margin:16px 0;}
  #fab-main{width:52px;height:52px;}
}
@media print{
  body *{visibility:hidden;}
  #print-area,#print-area *{visibility:visible;}
  #print-area{position:absolute;left:0;top:0;width:100%;}
}
</style>
</head>
<body>
<div id="boot-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 50% 20%,#232848 0%,#12131f 70%);color:#fff;font-family:Inter,sans-serif;transition:opacity .5s ease;">
  <div style="width:84px;height:84px;border-radius:22px;background:linear-gradient(145deg,#5B8CFF,#7C6CFF);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px -10px rgba(91,140,255,.55);font-weight:800;font-size:40px;margin-bottom:20px;">S</div>
  <h1 style="font-size:22px;font-weight:700;margin:0;">NovaCRM</h1>
  <p style="margin:6px 0 0;font-size:12px;opacity:.6;letter-spacing:1px;text-transform:uppercase;">Powered by Sabyx Labs</p>
</div>

<div id="app-shell">
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="mark.png" alt="Sabyx Labs" /></div>
      <div>
        <div style="font-weight:700;line-height:1.1;">NovaCRM</div>
        <div style="font-size:11px;color:var(--text-dim);line-height:1.1;">Sabyx Labs</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <button class="neu-btn" id="theme-toggle-btn" style="padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;gap:8px;justify-content:center;" onclick="cycleTheme()"></button>
    <p style="text-align:center;font-size:10.5px;color:var(--text-dim);opacity:.75;margin:0;letter-spacing:.2px;">&copy; <span id="copyright-year"></span> Sabyasachi Mondal</p>
  </aside>

  <div id="main">
    <div id="hosting-banner-wrap"></div>
    <header id="topbar">
      <button id="mobile-menu-btn" class="neu-btn" style="padding:10px;" onclick="openSidebar()">
        <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div></div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="notif-wrap">
          <button id="notif-bell" class="neu-btn" onclick="toggleNotifPanel()" title="Due &amp; overdue items">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span id="notif-badge"></span>
          </button>
          <div id="notif-panel" class="neu-card"></div>
        </div>
        <button id="pwa-install-btn" class="btn-ghost" style="display:none;" onclick="installNovaCRM()">
          <svg class="icon" viewBox="0 0 24 24" style="width:15px;height:15px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Install App
        </button>

<script>
// ===================== Utilities =====================
const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
const nowISO = () => new Date().toISOString();
const todayStr = () => new Date().toISOString().slice(0,10);

function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// A plain "YYYY-MM-DD" string (no time/zone) is parsed by `new Date()` as UTC
// midnight. Reading it back out with local getters (getDate/getMonth/etc — used
// everywhere below for display and day-matching) then silently shifts it a day
// in either direction depending on the viewer's UTC offset. Task due dates,
// invoice dates, and project deadlines are all stored this way, so every place
// that parses one of those fields should go through this helper instead of a
// bare `new Date(str)` — it parses date-only strings as a *local* calendar date
// so the day never moves. Full timestamps (with a "T"/time component, e.g.
// activity log entries or user-added calendar events) are left untouched since
// those are already correct instants.
function parseDateOnly(str){
  if(!str) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str).trim());
  if(m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}
function fmtDate(iso, opts){
  if(!iso) return '';
  const d = parseDateOnly(iso);
  if(!d || isNaN(d.getTime())) return '';
  opts = opts || {};
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if(opts.short) return d.getDate()+' '+months[d.getMonth()];
  if(opts.time) return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear()+' '+formatTime(d);
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function formatTime(d){
  let h = d.getHours(); const m = d.getMinutes();
  const ampm = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12;
  return h+':'+String(m).padStart(2,'0')+' '+ampm;
}
function monthShort(d){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; }
function addMonths(date, n){ const d = new Date(date); d.setMonth(d.getMonth()+n); return d; }
function ymKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function isSameDay(a,b){ return !!a && !!b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function isSameMonth(a,b){ return !!a && !!b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }
function isPastDate(iso){ const d = daysUntil(iso); return d!==null && d<0; }
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }

const CURRENCY_SYMBOLS = { INR:'Rs.', USD:'$', EUR:'\u20ac', GBP:'\u00a3' };
function fmtMoney(n, currency){
  currency = currency || 'INR';
  const symbol = CURRENCY_SYMBOLS[currency] || (currency+' ');
  n = Number(n)||0;
  return symbol + ' ' + n.toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function calcItem(item){
  const base = item.quantity * item.price;
  const discount = base * (item.discountPercent/100);
  const afterDiscount = base - discount;
  const tax = afterDiscount * (item.taxPercent/100);
  return { base, discount, tax, total: afterDiscount+tax };
}
function calcInvoiceTotals(invoice){
  let subtotal=0, totalTax=0, totalDiscount=0;
  (invoice.items||[]).forEach(item=>{
    const c = calcItem(item);
    subtotal += c.base; totalDiscount += c.discount; totalTax += c.tax;
  });
  const grandTotal = subtotal - totalDiscount + totalTax;
  const paid = invoice.amountPaid||0;
  const remaining = Math.max(grandTotal - paid, 0);
  const credit = Math.max(paid - grandTotal, 0); // overpayment — previously just vanished
  return { subtotal, totalTax, totalDiscount, grandTotal, remaining, credit };
}

function debounce(fn, ms){
  let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}

// Re-rendering a whole page section (as the search boxes below do) replaces the
// <input> DOM node, which silently drops focus/cursor position even though the
// element keeps the same id. This restores both so typing doesn't get
// interrupted every time the debounced re-render fires.
function refocusInput(id, cursorPos){
  const el = document.getElementById(id);
  if(!el) return;
  el.focus();
  if(typeof cursorPos==='number' && el.setSelectionRange){
    try{ el.setSelectionRange(cursorPos, cursorPos); }catch(e){}
  }
}

function isValidEmail(str){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(str||'').trim()); }
function isValidPhone(str){
  const digits = String(str||'').replace(/[\s()-]/g,'');
  return /^\+?[0-9]{7,15}$/.test(digits);
}
function markFieldInvalid(el){
  if(!el) return;
  el.style.boxShadow = 'inset 5px 5px 10px var(--shadow-a), inset -5px -5px 10px var(--shadow-b), 0 0 0 1.5px #EF4444';
  el.focus();
  const clear = () => { el.style.boxShadow=''; el.removeEventListener('input', clear); };
  el.addEventListener('input', clear);
}

// ===================== IndexedDB layer =====================
const DB_NAME = 'novacrm-db';
const DB_VERSION = 1;
const STORES = ['clients','projects','tasks','invoices','documents','calendarEvents','activity','settings'];
let _dbInstance = null;

function openDatabase(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      STORES.forEach(name=>{
        if(!db.objectStoreNames.contains(name)){
          db.createObjectStore(name, { keyPath: 'id' });
        }
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function getDB(){ if(!_dbInstance) _dbInstance = await openDatabase(); return _dbInstance; }

function txDone(tx){ return new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error); }); }

async function idbGetAll(store){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(store, id){
  const db = await getDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(store, value){
  const db = await getDB();
  const tx = db.transaction(store,'readwrite');
  tx.objectStore(store).put(value);
  await txDone(tx);
  return value;
}
async function idbDelete(store, id){
  const db = await getDB();
  const tx = db.transaction(store,'readwrite');
  tx.objectStore(store).delete(id);
  await txDone(tx);
}
async function idbClear(store){
  const db = await getDB();
  const tx = db.transaction(store,'readwrite');
  tx.objectStore(store).clear();
  await txDone(tx);
}

async function logActivity(message, type){
  const entry = { id: uid(), message, type, createdAt: nowISO() };
  await idbPut('activity', entry);
  return entry;
}

// ===================== App State =====================
const DEFAULT_SETTINGS = {
  id:'settings', businessName:'Sabyx Labs', businessLogoDataUrl:null,
  currency:'INR', taxPercent:18, invoicePrefix:'INV', theme:'system', ownerName:''
};

const STATE = {
  clients:[], projects:[], tasks:[], invoices:[], documents:[], calendarEvents:[], activity:[],
  settings: Object.assign({}, DEFAULT_SETTINGS)
};

async function loadAll(){
  const [clients, projects, tasks, invoices, documents, calendarEvents, activity, settings] = await Promise.all([
    idbGetAll('clients'), idbGetAll('projects'), idbGetAll('tasks'), idbGetAll('invoices'),
    idbGetAll('documents'), idbGetAll('calendarEvents'), idbGetAll('activity'), idbGet('settings','settings')
  ]);
  STATE.clients = clients.sort((a,b)=>a.name.localeCompare(b.name));
  STATE.projects = projects;
  STATE.tasks = tasks;
  STATE.invoices = invoices.sort((a,b)=> (b.invoiceDate||'').localeCompare(a.invoiceDate||''));
  STATE.documents = documents;
  STATE.calendarEvents = calendarEvents;
  STATE.activity = activity.sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,60);
  STATE.settings = settings || Object.assign({}, DEFAULT_SETTINGS);
  syncCustomLogoPreload();
  if(typeof refreshNotifications === 'function') refreshNotifications();
}
function syncCustomLogoPreload(){
  const el = document.getElementById('pdf-logo-custom');
  if(!el) return;
  const url = STATE.settings.businessLogoDataUrl;
  if(url && el.getAttribute('src') !== url) el.setAttribute('src', url);
  else if(!url) el.removeAttribute('src');
}

async function saveClient(c){ c.updatedAt = nowISO(); if(!c.createdAt) c.createdAt = nowISO(); await idbPut('clients', c); await logActivity('Client "'+c.name+'" saved','client'); await loadAll(); }
async function deleteClientRec(id){ await idbDelete('clients', id); await logActivity('Client removed','client'); await loadAll(); }
async function saveProjectRec(p){ p.updatedAt = nowISO(); if(!p.createdAt) p.createdAt = nowISO(); await idbPut('projects', p); await logActivity('Project "'+p.name+'" saved','project'); await loadAll(); }
async function deleteProjectRec(id){ await idbDelete('projects', id); await logActivity('Project removed','project'); await loadAll(); }
async function saveTaskRec(t){ t.updatedAt = nowISO(); if(!t.createdAt) t.createdAt = nowISO(); await idbPut('tasks', t); await logActivity('Task "'+t.title+'" saved','task'); await loadAll(); }
async function deleteTaskRec(id){ await idbDelete('tasks', id); await logActivity('Task removed','task'); await loadAll(); }
async function saveInvoiceRec(i){ i.updatedAt = nowISO(); if(!i.createdAt) i.createdAt = nowISO(); await idbPut('invoices', i); await logActivity('Invoice '+i.invoiceNumber+' saved','invoice'); await loadAll(); }
async function deleteInvoiceRec(id){ await idbDelete('invoices', id); await logActivity('Invoice removed','invoice'); await loadAll(); }
async function saveDocumentRec(d){ await idbPut('documents', d); await logActivity('Document "'+d.name+'" added','document'); await loadAll(); }
async function deleteDocumentRec(id){ await idbDelete('documents', id); await logActivity('Document removed','document'); await loadAll(); }
async function saveCalendarEventRec(e){ await idbPut('calendarEvents', e); await loadAll(); }
async function saveSettingsRec(s){ await idbPut('settings', s); await loadAll(); }

async function exportAllData(){
  const data = {};
  for(const s of STORES) data[s] = await idbGetAll(s);
  return { version: DB_VERSION, exportedAt: nowISO(), data };
}
async function importAllData(payload){
  for(const s of Object.keys(payload.data||{})){
    for(const item of payload.data[s]) await idbPut(s, item);
  }
}
async function clearAllData(){
  for(const s of STORES){ if(s!=='settings') await idbClear(s); }
}

// ===================== Theme =====================
function applyTheme(){
  const mode = localStorage.getItem('novacrm-theme') || 'system';
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const isDark = mode==='dark' || (mode==='system' && mq.matches);
  document.documentElement.classList.toggle('dark', isDark);
  const btn = document.getElementById('theme-toggle-btn');
  if(btn) btn.innerHTML = icon(mode==='light'?'sun':mode==='dark'?'moon':'globe') + ' <span style="text-transform:capitalize;">'+mode+' theme</span>';
}
function cycleTheme(){
  const cur = localStorage.getItem('novacrm-theme') || 'system';
  const next = cur==='light' ? 'dark' : cur==='dark' ? 'system' : 'light';
  localStorage.setItem('novacrm-theme', next);
  applyTheme();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

// Drive navigation explicitly instead of relying only on the browser's
// native hashchange event, which can be unreliable inside sandboxed
// preview iframes (e.g. when the hash is set programmatically or the
// destination hash equals the current one).
function navigateTo(evt, hash){
  if(evt){ evt.preventDefault(); }
  if(location.hash === hash){
    route();
  } else {
    location.hash = hash;
  }
  return false;
}

// ===================== Router dispatch =====================
const chartInstances = {};
function destroyCharts(){ Object.keys(chartInstances).forEach(k=>{ try{ chartInstances[k].destroy(); }catch(e){} delete chartInstances[k]; }); }

// Chart.js / jsPDF load from a CDN with `defer` so they never block the app
// from starting. On a slow or flaky connection they may not be ready the
// instant a page renders, so we poll briefly before giving up rather than
// throwing straight away.
function whenLibReady(checkFn, cb, timeoutMs){
  if(checkFn()){ cb(); return; }
  const start = Date.now();
  const iv = setInterval(()=>{
    if(checkFn()){ clearInterval(iv); cb(); }
    else if(Date.now()-start > (timeoutMs||10000)){ clearInterval(iv); }
  }, 150);
}

function parseHash(){
  const h = (location.hash || '#/').split('?')[0];
  const parts = h.replace(/^#\//,'').split('/').filter(Boolean);
  return { section: parts[0] || 'dashboard', id: parts[1] };
}

async function route(){
  closeSidebar();
  destroyCharts();
  renderNav();
  const { section, id } = parseHash();
  const page = document.getElementById('page');
  try{
    switch(section){
      case '': case 'dashboard': page.innerHTML = renderDashboard(); afterRenderDashboard(); break;
      case 'clients': if(id && id!=='new'){ page.innerHTML = renderClientProfile(id); afterRenderClientProfile(id); } else { page.innerHTML = renderClients(id==='new'); afterRenderClients(id==='new'); } break;
      case 'projects': page.innerHTML = renderProjects(); afterRenderProjects(id==='new'); break;
      case 'tasks': page.innerHTML = renderTasks(); afterRenderTasks(id==='new'); break;
      case 'billing': if(id){ page.innerHTML = renderInvoiceEditor(id==='new'?null:id); afterRenderInvoiceEditor(id==='new'?null:id); } else { page.innerHTML = renderBilling(); afterRenderBilling(); } break;
      case 'calendar': page.innerHTML = renderCalendar(); afterRenderCalendar(); break;
      case 'analytics': page.innerHTML = renderAnalytics(); afterRenderAnalytics(); break;
      case 'documents': page.innerHTML = renderDocuments(); afterRenderDocuments(); break;
      case 'settings': page.innerHTML = renderSettings(); afterRenderSettings(); break;
      case 'about': page.innerHTML = renderAbout(); break;
      default: page.innerHTML = renderDashboard(); afterRenderDashboard();
    }
  }catch(err){
    console.error(err);
    page.innerHTML = '<div class="neu-card empty"><p class="title">Something went wrong rendering this page.</p><p class="sub">'+escapeHtml(err.message)+'</p></div>';
  }
  window.scrollTo(0,0);
}

function formatFileSize(bytes){
  if(bytes==null) return '';
  if(bytes < 1024) return bytes+' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+' KB';
  return (bytes/(1024*1024)).toFixed(1)+' MB';
}
function onFileUploadChange(id){
  const input = document.getElementById(id);
  const zone = document.getElementById(id+'-zone');
  const chip = document.getElementById(id+'-chip');
  const file = input && input.files && input.files[0];
  if(!file){
    if(zone) zone.style.display='';
    if(chip) chip.classList.remove('show');
  } else {
    if(zone) zone.style.display='none';
    if(chip){
      chip.classList.add('show');
      const nameEl = document.getElementById(id+'-chip-name');
      const sizeEl = document.getElementById(id+'-chip-size');
      if(nameEl) nameEl.textContent = file.name;
      if(sizeEl) sizeEl.textContent = formatFileSize(file.size);
    }
  }
  const handler = window['_onFileUpload_'+id];
  if(typeof handler === 'function') handler(file || null);
}
function clearFileUpload(id){
  const input = document.getElementById(id);
  if(input) input.value = '';
  onFileUploadChange(id);
}
function setupFileDropzone(id){
  const input = document.getElementById(id);
  const zone = document.getElementById(id+'-zone');
  if(!input || !zone) return;
  input.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  input.addEventListener('dragleave', () => zone.classList.remove('drag'));
  input.addEventListener('drop', () => zone.classList.remove('drag'));
}

function readFileAsDataUrl(file){
  return new Promise((resolve,reject)=>{

  });
}

function afterRenderDashboard(){
  const { invoices, projects, settings } = STATE;
  const months = Array.from({length:6},(_,i)=>addMonths(new Date(), i-5));
  const labels = months.map(m=>monthShort(m));
  const data = months.map(m=> invoices.filter(i=>i.invoiceDate && ymKey(parseDateOnly(i.invoiceDate))===ymKey(m)).reduce((s,i)=>s+calcInvoiceTotals(i).grandTotal,0));
  whenLibReady(()=>typeof Chart!=='undefined', () => {
    const revCanvas = document.getElementById('chart-revenue');
    if(revCanvas){
      chartInstances.revenue = new Chart(revCanvas, {
        type:'line',
        data:{ labels, datasets:[{ label:'Revenue', data, borderColor:'#5B8CFF', backgroundColor:'rgba(91,140,255,0.15)', tension:.4, fill:true, pointBackgroundColor:'#7C6CFF', pointRadius:4 }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{grid:{color:'rgba(150,150,170,0.12)'}}, x:{grid:{display:false}} } }
      });

    const progCanvas = document.getElementById('chart-progress');

        options:{ plugins:{ legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}} } }
      });
    }
  });
}

// Advances a "YYYY-MM-DD" due date by one recurrence step. Returns '' if there's
// nothing to advance (no due date, or recurrence is 'None'/unrecognized).
function nextRecurrenceDate(dueDate, recurrence){
  if(!dueDate || !recurrence || recurrence==='None') return '';
  const d = parseDateOnly(dueDate);
  if(!d) return '';
  if(recurrence==='Daily') d.setDate(d.getDate()+1);
  else if(recurrence==='Weekly') d.setDate(d.getDate()+7);
  else if(recurrence==='Monthly') d.setMonth(d.getMonth()+1);
  else return '';
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
async function toggleTaskComplete(id){
  const t = STATE.tasks.find(x=>x.id===id);
  if(!t) return;
  const completing = !t.completed;
  await saveTaskRec(Object.assign({}, t, { completed: completing, completedAt: completing ? nowISO() : undefined }));
  // Recurring tasks: completing one schedules the next occurrence instead of
  // the recurrence label being purely decorative.
  if(completing && t.recurrence && t.recurrence!=='None'){
    const newDue = nextRecurrenceDate(t.dueDate, t.recurrence);
    if(newDue){
      await saveTaskRec(Object.assign({}, emptyTask(), {
        id: uid(),
        title: t.title,
        description: t.description||'',
        priority: t.priority,
        recurrence: t.recurrence,
        projectId: t.projectId||'',
        dueDate: newDue,
        checklist: (t.checklist||[]).map(c=>({ id: uid(), text:c.text, done:false }))
      }));
      showToast('Next "'+t.title+'" scheduled for '+fmtDate(newDue,{short:true}));
    }
  }
  route();
}
async function toggleChecklistItem(taskId, itemId){
  const t = STATE.tasks.find(x=>x.id===taskId);
  if(!t) return;
  const checklist = t.checklist.map(c=>c.id===itemId?Object.assign({},c,{done:!c.done}):c);
  await saveTaskRec(Object.assign({}, t, { checklist }));
  route();
}

function nextInvoiceNumber(){
  const prefix = STATE.settings.invoicePrefix || 'INV';
  const nums = STATE.invoices.filter(i=>i.invoiceNumber && i.invoiceNumber.indexOf(prefix)===0)
    .map(i=>parseInt(i.invoiceNumber.replace(prefix,'').replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  const next = (nums.length? Math.max(...nums): 0) + 1;
  return prefix+'-'+String(next).padStart(4,'0');
}

async function saveInvoiceFromEditor(){
  syncInvoiceDetailsFromForm();
  syncInvoiceClientFromForm();
  const inv = window._editingInvoice;
  if(!inv.clientName || !inv.clientName.trim()){ showToast('Client name is required'); document.getElementById('if-name').focus(); return; }
  const phone = (inv.phone||'').trim();
  const email = (inv.email||'').trim();
  if(!phone){ showToast('Client phone number is required'); markFieldInvalid(document.getElementById('if-phone')); return; }
  if(!isValidPhone(phone)){ showToast('Enter a valid client phone number'); markFieldInvalid(document.getElementById('if-phone')); return; }
  if(!email){ showToast('Client email is required'); markFieldInvalid(document.getElementById('if-email')); return; }
  if(!isValidEmail(email)){ showToast('Enter a valid client email address'); markFieldInvalid(document.getElementById('if-email')); return; }
  if(!inv.items || inv.items.length===0){ showToast('Add at least one item to the invoice'); return; }
  for(const item of inv.items){
    if(!item.serviceName || !item.serviceName.trim()){ showToast('Every item needs a service name'); return; }
    if(!(Number(item.quantity)>0)){ showToast('Item quantity must be greater than 0'); return; }
    if(Number(item.price)<0){ showToast('Item price cannot be negative'); return; }
    if(Number(item.taxPercent)<0){ showToast('Item tax percent cannot be negative'); return; }
    if(Number(item.discountPercent)<0 || Number(item.discountPercent)>100){ showToast('Item discount must be between 0 and 100%'); return; }
  }
  const totals = calcInvoiceTotals(inv);
  let status = inv.paymentStatus;
  if(inv.amountPaid >= totals.grandTotal && totals.grandTotal>0) status='Paid';
  else if(isPastDate(inv.dueDate) && inv.amountPaid < totals.grandTotal && status!=='Paid') status='Overdue';
  inv.paymentStatus = status;
  await saveInvoiceRec(inv);
  showToast('Invoice saved');
  location.hash = '#/billing';
}

// ===================== Invoice PDF (jsPDF + autotable) =====================
function imgFormatFor(el){
  const src = (el && el.getAttribute('src')) || '';
  if(src.startsWith('data:image/jpeg') || src.startsWith('data:image/jpg') || /\.jpe?g$/i.test(src)) return 'JPEG';
  if(src.startsWith('data:image/webp') || /\.webp$/i.test(src)) return 'WEBP';
  return 'PNG';
}
function generateInvoicePDF(invoice){
  const settings = STATE.settings;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 40;
  const currency = settings.currency || 'INR';

  // Watermark — faint logo centered behind everything, drawn first
  try{
    const pageHeightForWm = doc.internal.pageSize.getHeight();
    const customLogo = document.getElementById('pdf-logo-custom');
    const hasCustom = customLogo && customLogo.getAttribute('src') && customLogo.complete && customLogo.naturalWidth>0;
    const wmEl = hasCustom ? customLogo : document.getElementById('pdf-logo-lockup');
    if(wmEl && wmEl.complete && wmEl.naturalWidth>0){
      const wmW = pageWidth * 0.5;
      const wmH = wmW * (wmEl.naturalHeight / wmEl.naturalWidth);
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({ opacity:0.055 }));
      doc.addImage(wmEl, imgFormatFor(wmEl), (pageWidth-wmW)/2, (pageHeightForWm-wmH)/2, wmW, wmH);
      doc.restoreGraphicsState();
    }
  }catch(e){ console.error('Invoice watermark render failed', e); }

  doc.setFillColor(27,30,43);
  doc.rect(0,0,pageWidth,90,'F');
  doc.setTextColor(255,255,255);

  // Header logo, to the left of the business name
  let nameX = margin;
  try{
    const customLogo = document.getElementById('pdf-logo-custom');
    const hasCustom = customLogo && customLogo.getAttribute('src') && customLogo.complete && customLogo.naturalWidth>0;
    const hdEl = hasCustom ? customLogo : document.getElementById('pdf-logo-mark');
    if(hdEl && hdEl.complete && hdEl.naturalWidth>0){
      const logoH = 44;
      const logoW = logoH * (hdEl.naturalWidth / hdEl.naturalHeight);
      doc.addImage(hdEl, imgFormatFor(hdEl), margin, 23, logoW, logoH);
      nameX = margin + logoW + 14;
    }
  }catch(e){ console.error('Invoice header logo render failed', e); }

  doc.setFont('helvetica','bold'); doc.setFontSize(20);
  doc.text(settings.businessName || 'Sabyx Labs', nameX, 40);
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.text('Professional Business Solutions', nameX, 58);
  doc.setFontSize(16); doc.setFont('helvetica','bold');
  doc.text('INVOICE', pageWidth-margin, 40, { align:'right' });
  doc.setFontSize(10); doc.setFont('helvetica','normal');
  doc.text('# '+invoice.invoiceNumber, pageWidth-margin, 58, { align:'right' });

  let y = 120;
  doc.setTextColor(30,33,45); doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('Invoice Date', margin, y);
  doc.text('Due Date', margin+160, y);
  doc.text('Payment Status', margin+320, y);
  doc.setFont('helvetica','normal');
  doc.text(invoice.invoiceDate ? parseDateOnly(invoice.invoiceDate).toLocaleDateString() : '', margin, y+16);
  doc.text(invoice.dueDate ? parseDateOnly(invoice.dueDate).toLocaleDateString() : '', margin+160, y+16);
  const statusColor = { Paid:[34,158,94], Pending:[214,158,46], Overdue:[214,68,68] }[invoice.paymentStatus] || [100,100,100];
  doc.setTextColor.apply(doc, statusColor);
  doc.setFont('helvetica','bold');
  doc.text(invoice.paymentStatus, margin+320, y+16);
  doc.setTextColor(30,33,45);

  y += 46;
  doc.setDrawColor(225,228,235);
  doc.line(margin,y,pageWidth-margin,y);
  y += 24;

  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Billed To', margin, y);
  y += 16;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  const clientLines = [invoice.clientName, invoice.company, invoice.address,
    invoice.phone ? 'Phone: '+invoice.phone : null,
    invoice.email ? 'Email: '+invoice.email : null,
    invoice.gstNumber ? 'GSTIN: '+invoice.gstNumber : null].filter(Boolean);
  clientLines.forEach((line,idx)=>doc.text(String(line), margin, y+idx*14));
  y += clientLines.length*14 + 20;

  const rows = invoice.items.map(item=>{
    const c = calcItem(item);
    return [ item.serviceName + (item.description? '\n'+item.description : ''), String(item.quantity), fmtMoney(item.price,currency), item.discountPercent+'%', item.taxPercent+'%', fmtMoney(c.total,currency) ];
  });

  doc.autoTable({
    startY:y, head:[['Service','Qty','Price','Discount','Tax','Total']], body: rows, theme:'grid',
    headStyles:{ fillColor:[91,140,255], textColor:255, fontStyle:'bold' },
    styles:{ fontSize:9, cellPadding:8, textColor:[40,44,58] },
    columnStyles:{0:{cellWidth:190},1:{halign:'center'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}},
    margin:{ left:margin, right:margin }
  });

  const finalY = doc.lastAutoTable.finalY + 20;
  const totals = calcInvoiceTotals(invoice);
  const totalsX = pageWidth - margin - 200;
  let ty = finalY;
  function totalLine(label, value, bold){
    doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(bold?12:10);
    doc.text(label, totalsX, ty); doc.text(value, pageWidth-margin, ty, { align:'right' });
  }
  totalLine('Subtotal', fmtMoney(totals.subtotal,currency)); ty+=18;
  totalLine('Discount', '- '+fmtMoney(totals.totalDiscount,currency)); ty+=18;
  totalLine('Tax', fmtMoney(totals.totalTax,currency)); ty+=10;
  doc.setDrawColor(225,228,235); doc.line(totalsX,ty,pageWidth-margin,ty); ty+=18;
  totalLine('Grand Total', fmtMoney(totals.grandTotal,currency), true); ty+=20;
  totalLine('Amount Paid', fmtMoney(invoice.amountPaid||0,currency)); ty+=18;
  totalLine('Balance Due', fmtMoney(totals.remaining,currency), true); ty+=20;
  if(totals.credit>0){ totalLine('Credit Balance', fmtMoney(totals.credit,currency), true); ty+=20; }
  ty+=10;

  if(invoice.notes){
    doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text('Notes', margin, ty);
    doc.setFont('helvetica','normal');
    const split = doc.splitTextToSize(invoice.notes, pageWidth-margin*2);
    doc.text(split, margin, ty+16);
  }

  const pageHeight = doc.internal.pageSize.getHeight();
  doc.setDrawColor(225,228,235);
  doc.line(margin, pageHeight-70, pageWidth-margin, pageHeight-70);
  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(91,140,255);
  doc.text('Thank you for choosing Sabyx Labs.', margin, pageHeight-48);
  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(140,145,160);
  doc.text('Designed & Developed by Sabyx Labs', margin, pageHeight-32);

  return doc;
}
// If a custom logo was just uploaded, its <img src> may still be loading
// asynchronously the instant someone clicks Download/Print/Share. Without
// waiting, generateInvoicePDF's `.complete` check fails and it silently falls
// back to the default mark instead of the logo that was just set.
function waitForCustomLogo(timeoutMs){
  return new Promise(resolve=>{
    const el = document.getElementById('pdf-logo-custom');
    if(!el || !el.getAttribute('src') || (el.complete && el.naturalWidth>0)) return resolve();
    const done = () => resolve();
    el.addEventListener('load', done, { once:true });
    el.addEventListener('error', done, { once:true });
    setTimeout(done, timeoutMs||1500);
  });
}
async function downloadInvoicePDF(invoice){
  if(!window.jspdf){ showToast('PDF library is still loading — try again in a moment'); return; }
  await waitForCustomLogo();
  generateInvoicePDF(invoice).save(invoice.invoiceNumber+'.pdf');
}
async function printInvoicePDF(invoice){
  if(!window.jspdf){ showToast('PDF library is still loading — try again in a moment'); return; }
  await waitForCustomLogo();
  const doc = generateInvoicePDF(invoice); doc.autoPrint(); window.open(doc.output('bloburl'),'_blank');
}
async function shareInvoicePDF(invoice){
  if(!window.jspdf){ showToast('PDF library is still loading — try again in a moment'); return; }
  await waitForCustomLogo();
  const doc = generateInvoicePDF(invoice);
  const blob = doc.output('blob');
  const file = new File([blob], invoice.invoiceNumber+'.pdf', { type:'application/pdf' });
  if(navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title: invoice.invoiceNumber, text:'Invoice from Sabyx Labs' }); }catch(e){}
  } else { downloadInvoicePDF(invoice); }
}

    const text = await file.text();
    payload = JSON.parse(text);
  }catch(e){ showToast('Invalid backup file'); inp.value=''; return; }
  // Importing used to silently merge with whatever was already on the device —
  // surprising for anyone expecting "restore backup" to replace their data.
  // Ask explicitly instead.
  openModal('Import Backup',
    '<p style="font-size:14px;color:var(--text-dim);margin:0 0 6px;">This backup can be merged with your current data, or used to replace it entirely. Which would you like?</p>',
    '<button class="btn-ghost" onclick="closeModal();const f=document.getElementById(\'s-import-file\');if(f)f.value=\'\';">Cancel</button>'+
    '<button class="neu-btn" style="padding:10px 16px;font-size:14px;font-weight:600;" id="import-merge-btn">Merge</button>'+
    '<button class="btn-primary" style="background:#EF4444;" id="import-replace-btn">Replace All Data</button>'
  );
  document.getElementById('import-merge-btn').onclick = () => { closeModal(); finishImportData(payload, false); };
  document.getElementById('import-replace-btn').onclick = () => { closeModal(); finishImportData(payload, true); };
}
async function finishImportData(payload, replace){
  const inp = document.getElementById('s-import-file');
  try{
    if(replace) await clearAllData();
    await importAllData(payload);
    await loadAll();
    showToast(replace ? 'Data replaced with backup' : 'Backup merged with your data');
    route();
  }catch(e){ showToast('Import failed — the backup file may be malformed'); }
  if(inp) inp.value = '';
}
async function doClearAllData(){
  await clearAllData();
  await loadAll();
  showToast('All data cleared');
  route();
}

// ===================== Notifications (local — due/overdue tasks, invoices, deadlines) =====================
// No backend, no internet needed — everything here is derived from your own
// tasks, invoices and projects, same as the Calendar. "Read" state is
// remembered per browser via localStorage.
const NOTIF_LEAD_DAYS = 3; // flag things due within this many days as "upcoming", not just overdue
let notifItems = [];       // current computed list, freshest first
let notifKnownIds = new Set(); // ids seen so far this session, to avoid re-toasting the same one

function getNotifReadIds(){
  try{ return new Set(JSON.parse(localStorage.getItem('novacrm-notif-read')||'[]')); }catch(e){ return new Set(); }
}
function setNotifReadIds(set){
  try{ localStorage.setItem('novacrm-notif-read', JSON.stringify(Array.from(set))); }catch(e){}
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const target = parseDateOnly(dateStr); if(!target || isNaN(target.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  target.setHours(0,0,0,0);
  return Math.round((target - today) / 86400000);
}
function computeNotifications(){
  const items = [];
  STATE.tasks.filter(t=>!t.completed && t.dueDate).forEach(t=>{
    const d = daysUntil(t.dueDate);
    if(d===null || d>NOTIF_LEAD_DAYS) return;
    items.push({ id:'task-'+t.id, kind: d<0?'overdue':'due', category:'Task', title:t.title||'Untitled task',
      subtitle: d<0 ? 'Overdue by '+Math.abs(d)+' day'+(Math.abs(d)===1?'':'s') : (d===0?'Due today':'Due in '+d+' day'+(d===1?'':'s')),
      date:t.dueDate, hash:'#/tasks' });
  });
  STATE.invoices.filter(i=>i.paymentStatus!=='Paid' && i.dueDate).forEach(i=>{
    const d = daysUntil(i.dueDate);
    if(d===null || d>NOTIF_LEAD_DAYS) return;
    items.push({ id:'inv-'+i.id, kind: d<0?'overdue':'due', category:'Payment', title:i.invoiceNumber+' — '+(i.clientName||'Client'),
      subtitle: d<0 ? 'Payment overdue by '+Math.abs(d)+' day'+(Math.abs(d)===1?'':'s') : (d===0?'Payment due today':'Payment due in '+d+' day'+(d===1?'':'s')),
      date:i.dueDate, hash:'#/billing/'+i.id });
  });
  STATE.projects.filter(p=>p.deadline && p.status!=='Completed' && p.status!=='Cancelled').forEach(p=>{
    const d = daysUntil(p.deadline);
    if(d===null || d>NOTIF_LEAD_DAYS) return;
    items.push({ id:'proj-'+p.id, kind: d<0?'overdue':'due', category:'Project', title:p.name||'Untitled project',
      subtitle: d<0 ? 'Deadline passed '+Math.abs(d)+' day'+(Math.abs(d)===1?'':'s')+' ago' : (d===0?'Deadline today':'Deadline in '+d+' day'+(d===1?'':'s')),
      date:p.deadline, hash:'#/projects' });
  });
  // Overdue first, then soonest-due; stable enough without a full comparator library.
  items.sort((a,b)=>{
    if((a.kind==='overdue')!==(b.kind==='overdue')) return a.kind==='overdue' ? -1 : 1;
    return new Date(a.date) - new Date(b.date);
  });
  return items;
}
function initNotifications(){
  refreshNotifications();
  setInterval(refreshNotifications, 60000); // catches day-rollovers / newly-overdue items while the app sits open
}
function refreshNotifications(){
  const fresh = computeNotifications();
  const readIds = getNotifReadIds();
  const freshIds = new Set(fresh.map(i=>i.id));
  // Toast only for genuinely new items this session (not on first load).
  if(notifKnownIds.size>0){
    fresh.forEach(item=>{ if(!notifKnownIds.has(item.id) && !readIds.has(item.id)) showToast((item.kind==='overdue'?'Overdue: ':'Due soon: ')+item.title); });
  }
  notifKnownIds = freshIds;
  notifItems = fresh;
  renderNotifBadge();
  const panel = document.getElementById('notif-panel');
  if(panel && panel.classList.contains('open')) renderNotifPanel();
}
function renderNotifBadge(){
  const readIds = getNotifReadIds();
  const unread = notifItems.filter(i=>!readIds.has(i.id)).length;
  const badge = document.getElementById('notif-badge');
  if(!badge) return;
  badge.textContent = unread>99 ? '99+' : String(unread);
  badge.classList.toggle('show', unread>0);
}
function toggleNotifPanel(){
  const panel = document.getElementById('notif-panel');
  const willOpen = !panel.classList.contains('open');
  if(willOpen) positionNotifPanel();
  panel.classList.toggle('open', willOpen);
  if(willOpen) renderNotifPanel();
}
function positionNotifPanel(){
  const bell = document.getElementById('notif-bell');
  const panel = document.getElementById('notif-panel');
  if(!bell || !panel) return;
  const rect = bell.getBoundingClientRect();
  const margin = 8;
  const panelWidth = Math.min(340, window.innerWidth - margin*2);
  let left = rect.right - panelWidth; // align panel's right edge with the bell's right edge
  left = Math.max(margin, Math.min(left, window.innerWidth - panelWidth - margin));
  panel.style.width = panelWidth + 'px';
  panel.style.left = left + 'px';
  panel.style.top = (rect.bottom + 10) + 'px';
}
window.addEventListener('resize', ()=>{ const p=document.getElementById('notif-panel'); if(p && p.classList.contains('open')) positionNotifPanel(); });
document.addEventListener('click', (e)=>{
  const wrap = document.getElementById('notif-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('notif-panel').classList.remove('open');
});
function renderNotifPanel(){
  const panel = document.getElementById('notif-panel');
  const readIds = getNotifReadIds();
  if(notifItems.length===0){
    panel.innerHTML = '<div style="padding:16px;font-size:12.5px;color:var(--text-dim);">You\'re all caught up — no due or overdue items in the next '+NOTIF_LEAD_DAYS+' days.</div>';
    return;
  }
  const header = '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 8px 10px;"><span style="font-size:12px;font-weight:700;color:var(--text-dim);">Notifications</span><button class="btn-ghost" style="font-size:11px;padding:4px 8px;" onclick="markAllNotifRead()">Mark all read</button></div>';
  const body = notifItems.map(item=>{
    const unread = !readIds.has(item.id);
    const toneColor = item.kind==='overdue' ? '#EF4444' : '#d97706';
    return '<div class="notif-item'+(unread?' unread':'')+'" onclick=\'openNotifTarget("'+item.id+'","'+item.hash+'")\' style="cursor:pointer;">'+
      '<p class="notif-meta" style="color:'+toneColor+';font-weight:700;margin:0 0 2px;">'+escapeHtml(item.category)+' &middot; '+escapeHtml(item.subtitle)+'</p>'+
      '<p class="notif-name">'+escapeHtml(item.title)+'</p>'+
      '<div class="notif-actions">'+
        (unread? '<button class="btn-ghost" onclick=\'event.stopPropagation();markNotifRead("'+item.id+'")\'>Mark read</button>' : '')+
      '</div>'+
    '</div>';
  }).join('');
  panel.innerHTML = header + body;
}
function markNotifRead(id){
  const readIds = getNotifReadIds();
  readIds.add(id);
  setNotifReadIds(readIds);
  renderNotifBadge();
  renderNotifPanel();
}
function markAllNotifRead(){
  const readIds = getNotifReadIds();
  notifItems.forEach(i=>readIds.add(i.id));
  setNotifReadIds(readIds);
  renderNotifBadge();
  renderNotifPanel();
}
function openNotifTarget(id, hash){
  markNotifRead(id);
  document.getElementById('notif-panel').classList.remove('open');
  location.hash = hash;
}

// ===================== Bootstrap =====================

function showHostingBannerIfNeeded(){
  try{
    // Service worker registration (further down) requires https: or localhost —
    // plain http: on a real host doesn't qualify. The banner used to only
    // check for "any http/https host", so a site served over plain http (e.g.
    // an internal LAN server without TLS) showed no warning at all, even
    // though install/offline mode silently never activates there. Match the
    // same condition the SW registration actually uses.
    const installCapable = location.protocol === 'https:' || location.hostname === 'localhost';
    if(installCapable) return;
    if(localStorage.getItem('novacrm-hosting-banner-dismissed')==='1') return;
    const wrap = document.getElementById('hosting-banner-wrap');
    if(!wrap) return;
    const viaFile = location.protocol !== 'http:' && location.protocol !== 'https:';
    const reason = viaFile
      ? 'You\'re viewing this file directly rather than through a web server'
      : 'This is being served over plain HTTP rather than HTTPS';
    wrap.innerHTML =
      '<div class="hosting-banner neu-card">'+
        icon('globe','width:16px;height:16px;flex-shrink:0;margin-top:1px;')+
        '<span>'+reason+', so it can\'t be installed as an app from here. Everything else — clients, projects, billing and so on — works the same. To enable "Add to Home Screen" and offline mode, host this on HTTPS (GitHub Pages, Netlify, etc.) or run it via localhost.</span>'+
        '<button class="hb-close" onclick="dismissHostingBanner()">'+icon('x','width:15px;height:15px;')+'</button>'+
      '</div>';
  }catch(e){ /* localStorage unavailable — skip silently */ }
}
function dismissHostingBanner(){
  const wrap = document.getElementById('hosting-banner-wrap');
  if(wrap) wrap.innerHTML = '';
  try{ localStorage.setItem('novacrm-hosting-banner-dismissed','1'); }catch(e){}
}

async function bootstrap(){
  applyTheme();
  const yearEl = document.getElementById('copyright-year');
  if(yearEl) yearEl.textContent = new Date().getFullYear();
  showHostingBannerIfNeeded();
  try{ await loadAll(); }catch(e){ console.error('DB init error', e); }
  await route();
  initNotifications();
  const splash = document.getElementById('boot-splash');
  setTimeout(()=>{ if(splash){ splash.style.opacity='0'; setTimeout(()=>splash.remove(), 500); } }, 700);
}
window.addEventListener('hashchange', route);
// This script tag sits at the end of <body>, so the DOM it needs is already
// parsed by the time we reach here — no need to wait for DOMContentLoaded
// (which, with deferred CDN scripts above, could stall if that network is
// slow, blocked, or offline). Booting immediately keeps the core app fully
// usable even when Chart.js / jsPDF (used only for Analytics + PDF export)
// haven't loaded yet.
bootstrap();

// ===================== PWA install + service worker =====================
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', () => {
    fetch('sw.js', { method:'HEAD' }).then(res => {
      if(!res.ok) return;
      return navigator.serviceWorker.register('sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          if(!newWorker) return;
          newWorker.addEventListener('statechange', () => {
            if(newWorker.state === 'activated'){
              if(typeof showToast === 'function') showToast('NovaCRM updated — refresh to use the latest version');
            }
          });
        });
      });
    }).catch(() => { /* sw.js not deployed alongside this file — skip silently */ });
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'inline-flex';
});
window.installNovaCRM = async function(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'none';
};
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  if(typeof showToast === 'function') showToast('NovaCRM installed');
});
</script>
